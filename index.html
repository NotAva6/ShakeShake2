<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>POOK</title>
<style>
:root{--k:#12100e;--w:#f4ecd8;--o:#f5b26b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--k);color:var(--w);
  font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;font-weight:700;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;border-radius:0}
#wrap{max-width:420px;margin:0 auto;padding:10px 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}

/* codes gathered (above the device) */
#codes{display:flex;flex-direction:column;gap:6px;min-height:34px}
.crow{display:flex;gap:6px;align-items:center;border:0;background:none;padding:0;color:var(--w);width:100%}
.crow .lab{font-size:11px;width:46px;text-align:left;color:var(--o);letter-spacing:1px}
.cs{flex:1;border:2px solid var(--w);text-align:center;padding:5px 0;font-size:15px;letter-spacing:2px}
.cs.got{background:var(--o);color:var(--k);border-color:var(--o)}

/* the device */
#device{background:var(--w);color:var(--k);border-radius:22px 22px 44px 44px;padding:12px 14px 16px;border:3px solid var(--o);box-shadow:inset 0 0 0 3px var(--k)}
#brand{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;letter-spacing:6px;padding:2px 6px 8px}
#brand span{font-size:9px;letter-spacing:2px}
#bezel{background:var(--k);border-radius:12px 12px 28px 12px;padding:12px 12px 14px}
#screen{--bg:var(--w);--fg:var(--k);background:var(--bg);color:var(--fg);position:relative;overflow:hidden;animation:flick 7s infinite}
#screen.night{--bg:var(--k);--fg:var(--w);outline:1px solid var(--w)}
#status{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:3px 5px;border-bottom:2px solid var(--fg);letter-spacing:1px;height:24px}
.nd{display:inline-block;width:15px;height:15px;line-height:13px;text-align:center;border:1px solid var(--fg);margin-left:3px;font-size:10px}
.nd.on{background:var(--o);color:var(--k)}
#stage{position:relative;aspect-ratio:160/108;width:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#panel{position:absolute;inset:0;background:var(--bg);color:var(--fg);padding:6px 8px;font-size:12px;line-height:1.35;overflow:auto;text-transform:uppercase;display:flex;flex-direction:column;gap:5px;z-index:2}
#panel button{color:var(--fg);background:var(--bg);border:2px solid var(--fg);padding:5px 8px;text-transform:uppercase;font-size:12px}
#panel button:active{background:var(--fg);color:var(--bg)}
#panel button.o{background:var(--o);color:var(--k)}
#panel button:disabled{opacity:.35}
#panel .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center}
#panel .t{border-bottom:2px solid var(--fg);padding-bottom:2px}
#panel .big{font-size:20px;letter-spacing:3px;text-align:center;background:var(--o);color:var(--k);padding:6px 2px;-webkit-user-select:all;user-select:all;word-break:break-all}
#panel .c{text-align:center}
#panel .sp{flex:1}
#panel pre{margin:0;font:inherit;white-space:pre-wrap}
#panel canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:0 auto}
.dial{display:flex;flex-direction:column;align-items:center;gap:3px}
.dial b{font-size:22px;border:2px solid var(--fg);width:38px;text-align:center}
.dial button{width:38px}
.dg{display:inline-block;width:22px;height:22px;line-height:18px;text-align:center;border:2px solid transparent;font-size:15px;margin-right:3px}
.dg.l{border-color:var(--fg)}
.dg.f{background:var(--o);color:var(--k);border-color:var(--fg)}
.seq{min-height:24px;border:2px solid var(--fg);text-align:center;font-size:16px;letter-spacing:2px;padding:1px}
#msg{border-top:2px solid var(--fg);height:52px;padding:4px 6px;font-size:12px;line-height:1.25;text-transform:uppercase;overflow:hidden}
#inv{display:flex;border-top:2px solid var(--fg)}
.sl{flex:1;aspect-ratio:1;border:0;border-right:2px solid var(--fg);background:var(--bg);position:relative;padding:0;min-width:0}
.sl:last-child{border-right:0}
.sl canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.sl.sel{outline:3px solid var(--o);outline-offset:-3px}
.sl i{position:absolute;right:1px;bottom:0;font-size:9px;font-style:normal;color:var(--fg);background:var(--bg);padding:0 1px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(transparent 0 2px,rgba(18,16,14,.14) 2px 3px)}
#controls{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 2px}
.pad{display:flex;gap:12px}
.hb{width:58px;height:58px;border-radius:50%;border:3px solid var(--k);background:var(--k);color:var(--w);font-size:20px;box-shadow:0 4px 0 var(--o);display:flex;align-items:center;justify-content:center;padding:0}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--o)}
.hb.a{background:var(--o);color:var(--k);box-shadow:0 4px 0 var(--k)}
.tl{width:0;height:0;border-style:solid;border-width:10px 15px 10px 0;border-color:transparent var(--w) transparent transparent;margin-right:4px}
.tr{width:0;height:0;border-style:solid;border-width:10px 0 10px 15px;border-color:transparent transparent transparent var(--w);margin-left:4px}
#bmenu{font-size:10px;background:var(--k);color:var(--w);border:0;border-radius:10px;padding:6px 12px;letter-spacing:1px}
.legend{text-align:center;font-size:9px;letter-spacing:1px;margin-top:10px}
@keyframes flick{0%,91%,100%{opacity:1}92%{opacity:.84}93%{opacity:1}96%{opacity:.93}97%{opacity:1}}

/* intro splash */
#splash{position:fixed;inset:0;z-index:15;background:#000;color:var(--w);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;padding:34px;font-size:17px;line-height:1.7;letter-spacing:1.5px;text-align:center}
#splash p{margin:0;max-width:340px;min-height:1.7em}
#splash .tap{font-size:11px;color:var(--w);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* gift-giver setup (not part of the game) */
#setup{position:fixed;inset:0;z-index:20;background:var(--k);color:var(--w);overflow:auto;padding:16px}
#setup .in{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
#setup input,#setup textarea{width:100%;font:inherit;font-size:16px;background:var(--w);color:var(--k);border:2px solid var(--o);padding:8px;-webkit-user-select:text;user-select:text}
#setup textarea{min-height:64px}
#setup button{background:var(--o);color:var(--k);border:0;padding:10px;font-size:14px}
#setup button.g{background:var(--k);color:var(--w);border:2px solid var(--w)}
</style>
</head>
<body>
<div id="wrap">
  <div id="codes"></div>
  <div id="device">
    <div id="brand">POOK<span>POCKET COMPANION</span></div>
    <div id="bezel"><div id="screen">
      <div id="status"><span id="rname"></span><span id="needs"></span></div>
      <div id="stage"><canvas id="cv" width="160" height="108"></canvas><div id="panel" hidden></div></div>
      <div id="msg"></div>
      <div id="inv"></div>
      <div id="fx"></div>
    </div></div>
    <div id="controls">
      <button class="hb" id="bl" aria-label="Previous room"><span class="tl"></span></button>
      <button id="bmenu">MENU</button>
      <button class="hb" id="br" aria-label="Next room"><span class="tr"></span></button>
    </div>
    <div class="legend">&lt; &gt; CHANGE ROOM &nbsp;·&nbsp; TAP THE SCREEN</div>
  </div>
</div>
<div id="splash" hidden></div>
<div id="setup" hidden></div>

<script>
'use strict';
/* ====================================================================
   GIFT SETTINGS — the only part you need to edit.
   key:     the first Steam key exactly as given (dashes are fine).
   key2:    the second Steam key (leave blank for a one-key game).
   name:    who it is for (optional).
   message: shown with the final key (optional).
   Or leave blank and open the page with #setup on the end of the
   address to make a personal link from your phone.
   Press F1 (or add #debug to the address) for skip options in the MENU.
   ==================================================================== */
const BAKED = { key: '', key2: '', name: '', message: '' };
/* ==================================================================== */

const DEMO_KEYS = ['DEMO-KEY1-GOES-HERE', 'DEMO-KEY2-ALSO-HERE'];
const $ = s => document.querySelector(s);
const rand = n => Math.floor(Math.random() * n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- gift config (baked in, or carried in the link) ---------- */
function encCfg(o) {
  const b = new TextEncoder().encode(JSON.stringify(o)); let s = '';
  b.forEach((v, i) => { s += String.fromCharCode(v ^ ((73 + i * 7) & 255)); });
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decCfg(t) {
  try {
    const s = atob(t.replace(/-/g, '+').replace(/_/g, '/'));
    const b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) ^ ((73 + i * 7) & 255);
    const o = JSON.parse(new TextDecoder().decode(b));
    return o && typeof o.key === 'string' ? o : null;
  } catch (e) { return null; }
}
let CFG, isDemo = false;
function loadCfg() {
  const m = location.hash.match(/g=([A-Za-z0-9_-]+)/);
  const fromLink = m && decCfg(m[1]);
  if (fromLink) store.set('pook-cfg', fromLink);
  const c = fromLink || (BAKED.key.trim() ? BAKED : null) || store.get('pook-cfg');
  isDemo = !c || !String(c.key || '').trim();
  const keys = (isDemo ? DEMO_KEYS : [c.key, c.key2]).map(k => String(k || '').trim().toUpperCase()).filter(Boolean);
  CFG = { keys, name: (c && c.name) || '', message: (c && c.message) || '' };
}
function pieces(k) {
  const raw = CFG.keys[k].replace(/[^A-Z0-9]/g, ''); const out = []; let p = 0;
  for (let i = 0; i < 4; i++) { const len = Math.ceil((raw.length - p) / (4 - i)); out.push(raw.slice(p, p + len)); p += len; }
  return out;
}
const isDebug = () => forceDebug || /debug/i.test(location.hash);

/* ---------- save state ---------- */
const fresh = () => ({ boot: false, done: [0, 0, 0, 0, 0, 0, 0, 0], inv: [], room: 0, tape: 0, f: {}, hi: 0 });
let S = store.get('pook-v2') || fresh(), F = S.f, sel = null;
const save = () => store.set('pook-v2', S);
const nKeys = () => CFG.keys.length;
const stage = () => { for (let i = 0; i < 4 * nKeys(); i++) if (!S.done[i]) return i; return -1; };
const has = id => S.inv.includes(id);
const give = (...ids) => ids.forEach(id => { if (!has(id)) S.inv.push(id); });
const drop = (...ids) => { S.inv = S.inv.filter(x => !ids.includes(x)); if (ids.includes(sel)) sel = null; };

/* ---------- sound ---------- */
let AC = null, muted = !!store.get('pook-mute');
function ac() { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function beep(f, d = 0.1, type = 'square', vol = 0.04, when = 0) {
  if (muted) return;
  try {
    const a = ac(), o = a.createOscillator(), g2 = a.createGain(), t = a.currentTime + when;
    o.type = type; o.frequency.value = f; g2.gain.setValueAtTime(vol, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g2); g2.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
function hiss(d = 0.25) {
  if (muted) return;
  try {
    const a = ac(), n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * 0.12;
    const src = a.createBufferSource(); src.buffer = buf; src.connect(a.destination); src.start();
  } catch (e) {}
}
const sfx = {
  tap() { beep(440, .04); }, take() { beep(520, .06); beep(700, .08, 'square', .04, .07); },
  bad() { beep(110, .2, 'sawtooth', .04); }, good() { [392, 523, 659, 784].forEach((f, i) => beep(f, .16, 'square', .04, i * .12)); },
  note(i) { beep([262, 330, 392, 523][i], .35, 'triangle', .1); }
};

/* ---------- drawing: three colours only ---------- */
const COL = { w: '#f4ecd8', k: '#12100e', o: '#f5b26b' };
const elCv = $('#cv'), mainG = elCv.getContext('2d');
let g = mainG, PAL = COL, frame = 0, glitchT = 0;
const isNight = () => S.tape === 1 && !F.end;
const dayPal = { w: COL.w, k: COL.k, o: COL.o }, nightPal = { w: COL.k, k: COL.w, o: COL.o };
const R = (x, y, w, h, c = 'k') => { g.fillStyle = PAL[c] || c; g.fillRect(x, y, w, h); };
const B = (x, y, w, h, f = 'w', l = 'k') => { R(x, y, w, h, l); R(x + 1, y + 1, w - 2, h - 2, f); };
const D = (cx, cy, r, c = 'k') => {
  g.fillStyle = PAL[c] || c;
  for (let y = cy - r - 1; y <= cy + r + 1; y++) for (let x = cx - r - 1; x <= cx + r + 1; x++) { const dx = x - cx, dy = y - cy; if (dx * dx + dy * dy <= r * r + r) g.fillRect(x, y, 1, 1); }
};
const DO = (cx, cy, r, f = 'w') => { D(cx, cy, r + 1, 'k'); D(cx, cy, r, f); };
const dith = (x, y, w, h, c) => { g.fillStyle = PAL[c] || c; for (let yy = y; yy < y + h; yy++) for (let xx = x + ((yy + x) & 1); xx < x + w; xx += 2) g.fillRect(xx, yy, 1, 1); };
function base() {
  R(0, 0, 160, 108, 'w');
  if (PAL.w === COL.k) dith(0, 79, 160, 29, 'o'); else R(0, 79, 160, 29, 'o');
  R(0, 78, 160, 1, 'k');
}

/* Pook: a small white bichon. Always white with black features. */
function pook(cx, fy, o = {}) {
  const K = COL.k, W = COL.w, O = COL.o, bob = o.sleep ? 0 : (frame % 4 < 2 ? 0 : 1);
  const blob = list => { list.forEach(p => D(p[0], p[1], p[2] + 1, K)); list.forEach(p => D(p[0], p[1], p[2], W)); };
  blob([[cx + 11 + (o.sleep ? 0 : frame % 2), fy - 11, 2]]);
  blob([[cx, fy - 9, 8], [cx - 7, fy - 4, 4], [cx + 7, fy - 4, 4]]);
  blob([[cx - 3, fy - 2, 2], [cx + 3, fy - 2, 2]]);
  const hy = fy - 25 + bob;
  blob([[cx, hy, 9], [cx - 6, hy - 6, 4], [cx + 6, hy - 6, 4], [cx, hy - 8, 4], [cx - 9, hy + 1, 4], [cx + 9, hy + 1, 4], [cx - 7, hy + 6, 4], [cx + 7, hy + 6, 4]]);
  // curls
  [[-6, -8], [4, -10], [-10, 2], [9, 3], [7, -5]].forEach(c => { R(cx + c[0], hy + c[1], 2, 1, K); R(cx + c[0] - 1, hy + c[1] + 1, 1, 1, K); });
  [[-5, 12], [4, 15], [-8, 20]].forEach(c => { R(cx + c[0], hy + c[1], 2, 1, K); });
  const blink = o.sleep || frame % 23 === 0, stare = isNight() && frame % 41 === 0;
  if (blink) { R(cx - 5, hy, 2, 1, K); R(cx + 4, hy, 2, 1, K); }
  else { R(cx - 5, hy - 1, 2, 2, K); R(cx + 4, hy - 1, 2, 2, K); if (stare) { R(cx - 6, hy - 2, 4, 4, K); R(cx + 3, hy - 2, 4, 4, K); R(cx - 5, hy - 1, 2, 2, O); R(cx + 4, hy - 1, 2, 2, O); } }
  R(cx - 1, hy + 2, 3, 2, K);
  R(cx - 3, hy + 5, 1, 1, K); R(cx + 3, hy + 5, 1, 1, K); R(cx - 2, hy + 6, 5, 1, K);
  if (!o.sleep) { R(cx - 1, hy + 6, 3, 3, O); R(cx, hy + 6, 1, 2, K); }
  if (o.sleep) { const zx = cx + 14, zy = hy - 12 - (frame % 4); R(zx, zy, 4, 1, 'k'); R(zx + 2, zy + 1, 1, 1, 'k'); R(zx + 1, zy + 2, 1, 1, 'k'); R(zx, zy + 3, 4, 1, 'k'); }
}

/* item icons, 16x16 */
const CAPS = { jug5: 5, jug3: 3 };
const ICON = {
  coin() { DO(8, 8, 5, 'o'); R(7, 5, 2, 7); },
  opener() { R(3, 8, 3, 7); DO(10, 5, 3, 'w'); R(6, 6, 2, 2); R(10, 5, 1, 1); },
  can() { B(4, 3, 9, 11, 'w'); R(5, 6, 7, 4, 'o'); },
  canopen() { B(4, 4, 9, 10, 'w'); R(5, 7, 7, 4, 'o'); R(4, 1, 8, 1); R(11, 1, 1, 3); },
  ball() { DO(8, 8, 5, 'w'); R(3, 7, 11, 2, 'o'); R(8, 3, 1, 11); },
  plug() { R(4, 9, 8, 2); R(5, 11, 6, 3); R(7, 4, 2, 5); R(9, 3, 4, 1); R(13, 2, 1, 1, 'o'); },
  soap() { B(3, 8, 11, 6, 'w'); R(5, 10, 7, 1, 'o'); DO(11, 4, 1, 'w'); DO(6, 3, 1, 'w'); },
  key() { DO(5, 6, 2, 'o'); R(7, 6, 7, 1); R(11, 7, 1, 2); R(13, 7, 1, 3); },
  blanket() { B(2, 4, 12, 9, 'o'); R(2, 7, 12, 1); R(2, 10, 12, 1); },
  jug5() { B(3, 2, 9, 12, 'w'); R(12, 4, 2, 1); R(13, 4, 1, 6); R(12, 9, 2, 1); const h = Math.round(10 * (F.j5 || 0) / 5); R(4, 13 - h, 7, h, 'o'); },
  jug3() { B(4, 6, 7, 8, 'w'); R(11, 7, 2, 1); R(12, 7, 1, 4); R(11, 10, 2, 1); const h = Math.round(6 * (F.j3 || 0) / 3); R(5, 13 - h, 5, h, 'o'); },
  jar() { B(4, 4, 8, 10, 'w'); R(5, 2, 6, 2); R(5, 7, 6, 3, 'o'); },
  teddy() { DO(5, 3, 1, 'o'); DO(11, 3, 1, 'o'); DO(8, 6, 3, 'o'); DO(8, 12, 3, 'o'); R(7, 5, 1, 1); R(9, 5, 1, 1); R(8, 7, 1, 1); },
  crank() { R(3, 11, 7, 2); R(9, 4, 2, 8); R(9, 3, 5, 2); DO(13, 4, 1, 'o'); }
};
ICON.jar0 = ICON.jar1 = ICON.jar2 = ICON.jar;
const JARLAB = ['MEDICINE', 'NOT MEDICINE', 'MIXED'];
const NAME = id => ({
  coin: 'A COIN', opener: 'A CAN OPENER', can: 'A SEALED CAN', canopen: 'AN OPEN CAN', ball: 'A BALL', plug: 'A BATH PLUG', soap: 'SOAP',
  key: 'A SMALL KEY', blanket: 'A BLANKET', jug5: `BIG JUG (${F.j5 || 0} OF 5)`, jug3: `SMALL JUG (${F.j3 || 0} OF 3)`,
  jar0: `JAR LABELLED "${JARLAB[0]}"`, jar1: `JAR LABELLED "${JARLAB[1]}"`, jar2: `JAR LABELLED "${JARLAB[2]}"`, teddy: 'HIS BEAR', crank: 'A SMALL CRANK'
}[id]);

/* ---------- puzzles' fixed data ---------- */
const CUP_CODE = '327', CAB_CODE = '724';
const MAZE = [
  '#############',
  '#D..#.......#',
  '#.#.#.#####.#',
  '#.#...#...#.#',
  '#.#####.#.#.#',
  '#.....#.#...#',
  '#####.#.#####',
  '#.....#....B#',
  '#############'];
const MAZE_ANS = (() => {
  const find = ch => { for (let y = 0; y < MAZE.length; y++) { const x = MAZE[y].indexOf(ch); if (x >= 0) return [x, y]; } };
  const s = find('D'), e = find('B'), key = p => p[0] + ',' + p[1], prev = new Map([[key(s), null]]), q = [s];
  const dirs = { R: [1, 0], D: [0, 1], L: [-1, 0], U: [0, -1] };
  while (q.length) {
    const p = q.shift(); if (p[0] === e[0] && p[1] === e[1]) break;
    for (const d in dirs) { const n = [p[0] + dirs[d][0], p[1] + dirs[d][1]]; if (MAZE[n[1]][n[0]] !== '#' && !prev.has(key(n))) { prev.set(key(n), [p, d]); q.push(n); } }
  }
  let out = '', c = e; while (prev.get(key(c))) { const [p, d] = prev.get(key(c)); if (out[0] !== d) out = d + out; c = p; }
  return out;
})();
const ARROW = { L: '←', U: '↑', D: '↓', R: '→' };
const SW = [[0, 1], [1, 2], [1, 3], [0]];
const lights = () => F.lights || (F.lights = [1, 1, 1, 1]);
const JARS = [['poi', 'mix', 'med'], ['mix', 'med', 'poi']];
const SONG = ['BOWL', 'BALL', 'TUB', 'BED'];

/* ---------- messages / panels ---------- */
const elMsg = $('#msg'), elPanel = $('#panel');
let panelModal = false;
function say(t) { elMsg.textContent = t || ''; }
function openPanel(html, handler, modal) {

function copyText(t, btn) {
  const ok = () => { const old = btn.textContent; btn.textContent = 'COPIED'; setTimeout(() => { btn.textContent = old; }, 1500); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} ta.remove(); };

        H(10, 42, 18, 18, () => { if (N) return say('THE TAP TURNS. NOTHING COMES OUT. THEN SOMETHING DOES. YOU TURN IT OFF.'); F.tap = F.tap ? 0 : 1; if (F.tap) F.fog = 1; sfx.tap(); say(F.tap ? 'HOT WATER. STEAM CRAWLS UP THE MIRROR.' : 'THE TAP DRIPS.'); }),
        H(58, 50, 12, 10, () => say(N ? 'THE DUCK FACES YOU NOW.' : 'A RUBBER DUCK. IT FACES THE WALL.')),
        H(8, 60, 78, 28, it => {
          if (N) return F.teddy ? say('AN EMPTY TUB.') : searchWrong('THE TUB IS EMPTY. THE DRAIN GURGLES.');
          if (S.done[2]) return say('GREY WATER. BEST NOT TO LOOK.');
          if (it === 'plug') { F.plug = 1; drop('plug'); sfx.tap(); say('THE PLUG FITS THE DRAIN.'); }
          else if (it === 'soap') { if (!(F.plug && F.tap)) return say('NOTHING TO LATHER.'); F.soap = 1; drop('soap'); sfx.tap(); say('BUBBLES.'); }
          if (F.plug && F.tap && F.soap) return S.done[1] ? need(2) : say('A PERFECT BATH. POOK IS NOT DIRTY ENOUGH TO NEED IT. GIVE HIM TIME.');
          if (it === 'plug' || it === 'soap') return;
          say(!F.plug ? 'THE TUB WILL NOT HOLD WATER. THE PLUG IS MISSING.' : !F.tap ? 'PLUGGED. DRY.' : 'WARM WATER. NO BUBBLES. POOK REQUIRES BUBBLES.');
        }),
        H(107, 13, 30, 20, () => {
          if (N) { glitch(250); return say('A MIRROR. YOUR REFLECTION ARRIVES A LITTLE LATE.'); }
          if (!F.fog) return say('A MIRROR. YOU LOOK FINE.');
          note('WRITTEN IN THE STEAM, BY A FINGER', '▲ + ▲ + ● = 15\n▲ + ● + ● = 18\n■ × ▲ = 8\n\nTHE CABINET:  ● ■ ▲');
        }),
        H(104, 33, 36, 12, () => {
          if (!F.cab) return lockPanel('cab', 'A MIRROR CABINET. THREE DIALS.', ['●', '■', '▲'], CAB_CODE, () => { F.cab = 1; give('soap', 'key'); say('THE CABINET OPENS. SOAP. AND A SMALL KEY. TAKEN.'); });
          if (N) return S.done[5] ? say('THREE JARS. LEAVE THEM.') : jarPanel();
          say('AN EMPTY CABINET.');
        }),
        H(90, 44, 12, 18, () => say('A TOWEL. DAMP. NOBODY HAS USED IT.'))
      ];
    } },
  { name: 'BEDROOM',
    draw() {
      const N = isNight();
      base();
      B(26, 8, 30, 26); B(28, 10, 26, 22, 'o'); R(31, 13, 8, 1); R(38, 13, 1, 8); R(38, 20, 10, 1); R(47, 20, 1, 8); R(31, 27, 3, 2); // poster
      B(4, 42, 6, 38); B(8, 62, 72, 12); R(10, 74, 3, 6); R(75, 74, 3, 6); B(12, 56, 18, 8);  // bed
      if (F.blanket) { B(34, 60, 46, 16, 'o'); R(34, 65, 46, 1); R(34, 70, 46, 1); }
      B(82, 62, 14, 16); R(84, 69, 10, 1); R(88, 71, 2, 1);                                 // nightstand
      if (N) { B(84, 55, 10, 7, 'o'); R(94, 57, 3, 1); } else { R(88, 52, 2, 10); B(84, 45, 10, 8, 'o'); }
      B(100, 14, 36, 64); R(118, 15, 1, 62); R(115, 44, 2, 4); R(120, 44, 2, 4);            // wardrobe
      if (F.ward) R(101, 15, 17, 62, 'k');
      B(141, 30, 12, 18); lights().forEach((v, i) => R(143 + (i % 2) * 5, 33 + ((i / 2) | 0) * 7, 3, 4, v ? 'o' : 'k')); // switches
    },
    hot() {
      const N = isNight();
      return [
        H(139, 28, 16, 22, () => N ? say('THE SWITCHES DO NOTHING NOW.') : S.done[3] ? say('LEAVE THE LIGHTS.') : switchPanel()),
        H(26, 8, 30, 26, () => mazePanel()),
        H(82, 44, 16, 34, it => {
          if (!N) return say('A LAMP. A DRAWER WITH NOTHING IN IT.');
          if (!F.crank) { if (it === 'crank') { F.crank = 1; drop('crank'); sfx.take(); return say('THE CRANK FITS THE MUSIC BOX.'); } return say('A MUSIC BOX. THE CRANK IS MISSING. IT WAS NOT HERE YESTERDAY.'); }
          S.done[7] ? say('THE BOX IS STILL TURNING.') : boxPanel();
        }),
        H(4, 42, 78, 38, it => {
          if (N) return say('THE BED IS STILL WARM.');
          if (it === 'blanket') { F.blanket = 1; drop('blanket'); sfx.tap(); if (lights().every(v => !v) && S.done[2]) return need(3); return say('THE BED IS MADE. THE LIGHTS ARE STILL ON.'); }
          say(F.blanket ? 'MADE. WAITING.' : 'A BARE MATTRESS.');
        }),
        H(100, 14, 36, 64, it => {
          if (N) { if (F.teddy) return say('COAT HANGERS. THEY SWAY.'); F.teddy = 1; give('teddy'); sfx.take(); return say('BEHIND THE COATS: HIS BEAR. IT WAS FACING THE DOOR. TAKEN.'); }
          if (F.ward) return say('COAT HANGERS. THEY SWAY.');
          if (it === 'key') { F.ward = 1; drop('key'); give('blanket'); sfx.take(); return say('THE KEY TURNS. INSIDE: ONE BLANKET. TAKEN.'); }
          say('A WARDROBE. LOCKED. A SMALL KEYHOLE.');
        })
      ];
    } }
];

/* ---------- render ---------- */
function draw() {
  g = mainG;
  const dark = S.room === 3 && S.tape === 0 && !F.end && lights().every(v => !v);
  PAL = (isNight() || dark) ? nightPal : dayPal;
  ROOMS[S.room].draw();
  if (F.end) { if (S.room === 3) pook(52, 64, { sleep: true }); }
  else pook(pookSpot[S.room][0], pookSpot[S.room][1]);
  if (Date.now() < glitchT) {
    for (let i = 0; i < 6; i++) { const y = rand(104), h = 2 + rand(9), dx = rand(21) - 10; g.drawImage(elCv, 0, y, 160, h, dx, y, 160, h); }
    R(0, rand(108), 160, 1, 'o');
  }
}
function glitch(ms) { glitchT = Date.now() + ms; hiss(Math.min(ms / 1000, .4)); const t = setInterval(() => { draw(); if (Date.now() > glitchT) { clearInterval(t); draw(); } }, 50); }
function renderInv() {
  const el = $('#inv'); let h = '';
  for (let i = 0; i < 7; i++) { const id = S.inv[i]; h += `<button class="sl ${id && id === sel ? 'sel' : ''}" data-i="${id || ''}">${id ? '<canvas width="16" height="16"></canvas>' : ''}${id === 'jug5' ? `<i>${F.j5 || 0}/5</i>` : id === 'jug3' ? `<i>${F.j3 || 0}/3</i>` : ''}</button>`; }
  el.innerHTML = h;
  el.querySelectorAll('.sl').forEach(b => { const c = b.querySelector('canvas'); if (!c) return; g = c.getContext('2d'); PAL = isNight() ? nightPal : dayPal; R(0, 0, 16, 16, 'w'); ICON[b.dataset.i](); });
  g = mainG;
}
function render() {
  $('#screen').classList.toggle('night', isNight());
  const t = S.tape, L = t ? ['D', 'M', 'B', 'S'] : ['F', 'P', 'W', 'S'];
  $('#rname').textContent = (F.end ? 'END ' : 'TAPE ' + (t + 1) + ' ') + ROOMS[S.room].name;
  $('#needs').innerHTML = L.map((c, i) => `<span class="nd ${S.done[t * 4 + i] ? 'on' : ''}">${c}</span>`).join('');
  $('#codes').innerHTML = CFG.keys.map((key, k) => (k > 0 && S.tape < k) ? '' :
    `<button class="crow" data-k="${k}"><span class="lab">KEY ${k + 1}</span>${pieces(k).map((p, n) => `<span class="cs ${S.done[k * 4 + n] ? 'got' : ''}">${S.done[k * 4 + n] ? esc(p) : '?'.repeat(p.length || 1)}</span>`).join('')}</button>`).join('')
    + (isDemo ? '<div style="font-size:9px;text-align:center;color:var(--o)">DEMO KEYS — ADD #SETUP TO THE ADDRESS</div>' : '');
  renderInv(); draw();
}
setInterval(() => { frame++; if (elPanel.hidden) draw(); if (elPanel.hidden && isNight() && rand(140) === 0) glitch(180); }, 260);

/* ---------- input ---------- */
elCv.addEventListener('click', e => {
  if (!elPanel.hidden) return;
  const r = elCv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 160, y = (e.clientY - r.top) / r.height * 108;
  if (F.end) return say('POOK IS ASLEEP. HAPPY BIRTHDAY.');
  const it = sel; sel = null;
  const ps = pookSpot[S.room];
  const spots = [H(ps[0] - 14, ps[1] - 40, 28, 42, onPook), ...ROOMS[S.room].hot()];
  const h = spots.find(s => x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h);
  if (h) h.a(it); else say(it ? 'NOTHING HAPPENS.' : 'NOTHING THERE.');
  save(); if (elPanel.hidden) render(); else renderInv();
});
$('#inv').addEventListener('click', e => {
  const b = e.target.closest('.sl'); if (!b || !b.dataset.i || !elPanel.hidden) return; const id = b.dataset.i;
  if (!sel) { sel = id; sfx.tap(); say(`${NAME(id)}. NOW TAP WHERE TO USE IT.`); }
  else if (sel === id) { sel = null; say(''); }
  else {
    const a = sel, pair = [a, id].sort().join('+'); sel = null;
    if (pair === 'can+opener') { drop('can', 'opener'); give('canopen'); sfx.take(); say('THE OPENER BITES THE CAN. IT IS OPEN. IT SMELLS LIKE A DECISION.'); }
    else if (pair === 'jug3+jug5') pourJug(a, id);
    else say('THOSE DO NOT GO TOGETHER.');
    save();
  }
  renderInv();
});
function go(d) { if (panelModal) return; closePanel(); sel = null; S.room = (S.room + d + 4) % 4; sfx.tap(); say(''); save(); render(); }
$('#bl').addEventListener('click', () => go(-1));
$('#br').addEventListener('click', () => go(1));
let forceDebug = false;
document.addEventListener('keydown', e => { if (e.key === 'F1') { e.preventDefault(); forceDebug = true; if (!panelModal) menu(); } });
$('#codes').addEventListener('click', e => { const b = e.target.closest('.crow'); if (!b || !elPanel.hidden) return; const k = +b.dataset.k; if (S.done.slice(k * 4, k * 4 + 4).every(Boolean)) keyReveal(k, null); });
$('#bmenu').addEventListener('click', () => { if (!panelModal) menu(); });
function menu() {
  const dbg = isDebug(), st = stage();
  openPanel(`<div class="t">MENU</div><div class="row"><button data-a="snd">SOUND: ${muted ? 'OFF' : 'ON'}</button><button data-a="x">CLOSE</button></div>
    ${dbg ? `<div class="t">DEBUG — NEXT PUZZLE: ${st < 0 ? 'NONE' : (st + 1) + ' OF ' + 4 * nKeys()}</div>
    <div class="row"><button class="o" data-a="skip">SOLVE NEXT PUZZLE</button><button data-a="tape">JUMP TO TAPE 2</button><button data-a="ans">SHOW ANSWERS</button><button data-a="reset">RESET EVERYTHING</button></div>` : ''}`,
    a => {
      if (a === 'x') return closePanel();
      if (a === 'snd') { muted = !muted; store.set('pook-mute', muted); sfx.tap(); return menu(); }
      if (a === 'skip') { dbgSolve(); return menu(); }
      if (a === 'tape') { while (stage() >= 0 && stage() < 4) dbgSolve(); return menu(); }
      if (a === 'reset') { S = fresh(); S.boot = true; F = S.f; sel = null; save(); closePanel(); say('RESET.'); return render(); }
      if (a === 'ans') return note('ANSWERS', `1 CUPBOARD ${CUP_CODE}. COIN (SOFA) OPENS DRAWER. OPENER + CAN. CAN ON BOWL.
2 TOY BOX ${[...MAZE_ANS].map(c => ARROW[c]).join('')}. BALL ON POOK.
3 HOT TAP, MIRROR, CABINET ${CAB_CODE}. PLUG + SOAP ON TUB.
4 KEY ON WARDROBE, BLANKET ON BED, SWITCHES 1 2 3.
5 TAKE JUGS. FILL 5, POUR INTO 3, EMPTY 3, POUR 5 INTO 3, FILL 5, POUR INTO 3. BIG JUG (4) ON BOWL.
6 CABINET: PILL FROM "MIXED". WHITE = GIVE THAT JAR. ORANGE = GIVE "NOT MEDICINE".
7 TV. BEAR IS IN THE WARDROBE. BEAR ON POOK.
8 CRANK ON MUSIC BOX. ${SONG.join(' ')}.`);
    });
}
function dbgSolve() {
  const i = stage(); if (i < 0) return;
  S.done[i] = 1; FIX[i](); S.hi = 0;
  if (i === 3 && nKeys() > 1) startNight();
  if (i === 4 * nKeys() - 1) { F.end = 1; S.room = 3; }
  save(); render();
}

/* ---------- gift-giver setup ---------- */
function setup() {
  const c = store.get('pook-cfg') || BAKED, el = $('#setup');
  el.innerHTML = `<div class="in"><div style="font-size:18px;color:var(--o)">GIFT SETUP</div><div>Only for the gift-giver. Fill this in, make the link, and send that link on the day.</div>
    <label>Steam key 1 (tape one)<input id="skey" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX" value="${esc(c.key || '')}"></label>
    <label>Steam key 2 (tape two — blank for a one-key game)<input id="skey2" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX" value="${esc(c.key2 || '')}"></label>
    <label>Their name (optional)<input id="sname" autocomplete="off" value="${esc(c.name || '')}"></label>
    <label>Message shown at the very end (optional)<textarea id="smsg">${esc(c.message || '')}</textarea></label>
    <button id="smake">MAKE LINK</button>
    <div id="sout" hidden><label>Personal link<textarea id="slink" readonly></textarea></label><button id="scopy">COPY LINK</button> <button id="sopen" class="g">TRY IT</button></div>
    <button id="sreset" class="g">RESET PROGRESS ON THIS PHONE</button><button id="sclose" class="g">CLOSE</button></div>`;
  el.hidden = false;
  $('#smake').onclick = () => {
    const o = { key: $('#skey').value.trim(), key2: $('#skey2').value.trim(), name: $('#sname').value.trim(), message: $('#smsg').value.trim() };
    if (!o.key) { $('#skey').focus(); return; }
    $('#slink').value = location.href.split('#')[0] + '#g=' + encCfg(o); $('#sout').hidden = false;
  };
  $('#scopy').onclick = () => copyText($('#slink').value, $('#scopy'));
  $('#sopen').onclick = () => { location.href = $('#slink').value; location.reload(); };
  $('#sreset').onclick = () => { store.del('pook-v2'); S = fresh(); F = S.f; sel = null; $('#sreset').textContent = 'PROGRESS RESET'; };
  $('#sclose').onclick = () => { el.hidden = true; history.replaceState(null, '', location.href.split('#')[0]); boot(); };
}

/* ---------- intro splash: black screen, text types itself ---------- */
function splash(done) {
  const el = $('#splash'), lines = ['FOR YOUR BIRTHDAY, YOU WERE GIFTED AN OLD TOY YOU SCARCELY REMEMBER FROM CHILDHOOD.', 'BUT SOMETHING FEELS DIFFERENT.'];
  el.innerHTML = '<p id="sp0"></p><p id="sp1" style="color:var(--o)"></p><p id="sp2" class="tap" style="visibility:hidden">TAP TO BEGIN</p>'; el.hidden = false;
  let li = 0, ci = 0, fin = false, timer = 0;
  const finish = () => { fin = true; clearTimeout(timer); lines.forEach((t, i) => { $('#sp' + i).textContent = t; }); $('#sp2').style.visibility = 'visible'; };
  const step = () => {
    if (li >= lines.length) return finish();
    $('#sp' + li).textContent = lines[li].slice(0, ++ci);
    if (ci >= lines[li].length) { li++; ci = 0; timer = setTimeout(step, 1800); } else timer = setTimeout(step, 75);
  };
  timer = setTimeout(step, 1000);
  el.onclick = () => { if (!fin) return finish(); el.hidden = true; el.onclick = null; clearTimeout(timer); sfx.tap(); done(); };
}

/* ---------- boot ---------- */
function boot() {
  loadCfg(); F = S.f; $('#setup').hidden = true;
  if (/(^|#|&)setup\b/.test(location.hash)) return setup();
  closePanel(); render(); say('');
  $('#splash').hidden = true;
  if (!S.boot) splash(() => pages(['POOK-OS 1.3\n(C) 1987 SHAKECO HOME ELECTRONICS\n\nCARETAKER UNIT ONLINE.', `LOADING COMPANION: POOK\n................ OK\n\nHAPPY BIRTHDAY${CFG.name ? ', ' + esc(CFG.name) : ''}.`,
    'POOK HAS NEEDS.\nMEET THEM, AND POOK WILL GIVE BACK\nWHAT HE IS KEEPING FOR YOU.\n\nTAP THINGS. PICK THINGS UP.\nUSE THEM ON OTHER THINGS.', 'DO NOT LEAVE POOK ALONE\nFOR TOO LONG.'],
    () => { S.boot = true; save(); say('POOK STARES AT THE EMPTY BOWL.'); }));
}
window.addEventListener('hashchange', boot);
boot();
</script>
