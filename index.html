<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>POOK</title>
<style>
:root{--k:#12100e;--w:#f4ecd8;--o:#f5b26b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--k);color:var(--w);
  font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;font-weight:700;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;border-radius:0}
#wrap{max-width:420px;margin:0 auto;padding:10px 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}

/* codes gathered (above the device) */
#codes{display:flex;flex-direction:column;gap:6px;min-height:34px}
.crow{display:flex;gap:6px;align-items:center;border:0;background:none;padding:0;color:var(--w);width:100%}
.crow .lab{font-size:11px;width:46px;text-align:left;color:var(--o);letter-spacing:1px}
.cs{flex:1;border:2px solid var(--w);text-align:center;padding:5px 0;font-size:15px;letter-spacing:2px}
.cs.got{background:var(--o);color:var(--k);border-color:var(--o)}

/* the device */
#device{background:var(--w);color:var(--k);border-radius:22px 22px 44px 44px;padding:12px 14px 16px;border:3px solid var(--o);box-shadow:inset 0 0 0 3px var(--k)}
#brand{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;letter-spacing:6px;padding:2px 6px 8px}
#brand span{font-size:9px;letter-spacing:2px}
#bezel{background:var(--k);border-radius:12px 12px 28px 12px;padding:12px 12px 14px}
#screen{--bg:var(--w);--fg:var(--k);background:var(--bg);color:var(--fg);position:relative;overflow:hidden;animation:flick 7s infinite}
#screen.night{--bg:var(--k);--fg:var(--w);outline:1px solid var(--w)}
#status{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:3px 5px;border-bottom:2px solid var(--fg);letter-spacing:1px;height:24px}
.nd{display:inline-block;width:15px;height:15px;line-height:13px;text-align:center;border:1px solid var(--fg);margin-left:3px;font-size:10px}
.nd.on{background:var(--o);color:var(--k)}
#stage{position:relative;aspect-ratio:160/108;width:100%}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#panel{position:absolute;inset:0;background:var(--bg);color:var(--fg);padding:6px 8px;font-size:12px;line-height:1.35;overflow:auto;text-transform:uppercase;display:flex;flex-direction:column;gap:5px;z-index:2}
#panel button{color:var(--fg);background:var(--bg);border:2px solid var(--fg);padding:5px 8px;text-transform:uppercase;font-size:12px}
#panel button:active{background:var(--fg);color:var(--bg)}
#panel button.o{background:var(--o);color:var(--k)}
#panel button:disabled{opacity:.35}
#panel .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center}
#panel .t{border-bottom:2px solid var(--fg);padding-bottom:2px}
#panel .big{font-size:20px;letter-spacing:3px;text-align:center;background:var(--o);color:var(--k);padding:6px 2px;-webkit-user-select:all;user-select:all;word-break:break-all}
#panel .c{text-align:center}
#panel .sp{flex:1}
#panel pre{margin:0;font:inherit;white-space:pre-wrap}
#panel canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:0 auto}
.dial{display:flex;flex-direction:column;align-items:center;gap:3px}
.dial b{font-size:22px;border:2px solid var(--fg);width:38px;text-align:center}
.dial button{width:38px}
.dg{display:inline-block;width:22px;height:22px;line-height:18px;text-align:center;border:2px solid transparent;font-size:15px;margin-right:3px}
.dg.l{border-color:var(--fg)}
.dg.f{background:var(--o);color:var(--k);border-color:var(--fg)}
.tile{width:48px;height:48px;padding:2px!important}
.tile canvas{width:100%;height:100%}
.tile.on{outline:3px solid var(--o);outline-offset:1px}
.seq{min-height:24px;border:2px solid var(--fg);text-align:center;font-size:16px;letter-spacing:2px;padding:1px}
#msg{border-top:2px solid var(--fg);height:52px;padding:4px 6px;font-size:12px;line-height:1.25;text-transform:uppercase;overflow:hidden}
#inv{display:flex;border-top:2px solid var(--fg)}
.sl{flex:1;aspect-ratio:1;border:0;border-right:2px solid var(--fg);background:var(--bg);position:relative;padding:0;min-width:0}
.sl:last-child{border-right:0}
.sl canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.sl.sel{outline:3px solid var(--o);outline-offset:-3px}
.sl i{position:absolute;right:1px;bottom:0;font-size:9px;font-style:normal;color:var(--fg);background:var(--bg);padding:0 1px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(transparent 0 2px,rgba(18,16,14,.14) 2px 3px)}
#controls{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 2px}
.pad{display:flex;gap:12px}
.hb{width:58px;height:58px;border-radius:50%;border:3px solid var(--k);background:var(--k);color:var(--w);font-size:20px;box-shadow:0 4px 0 var(--o);display:flex;align-items:center;justify-content:center;padding:0}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--o)}
.hb.a{background:var(--o);color:var(--k);box-shadow:0 4px 0 var(--k)}
.tl{width:0;height:0;border-style:solid;border-width:10px 15px 10px 0;border-color:transparent var(--w) transparent transparent;margin-right:4px}
.tr{width:0;height:0;border-style:solid;border-width:10px 0 10px 15px;border-color:transparent transparent transparent var(--w);margin-left:4px}
#bmenu,#bwords{font-size:10px;background:var(--k);color:var(--w);border:0;border-radius:10px;padding:7px 14px;letter-spacing:1px}
#bwords{background:var(--o);color:var(--k);box-shadow:0 3px 0 var(--k)}
.mid{display:flex;flex-direction:column;gap:9px;align-items:center}
.hw{font-size:16px;white-space:nowrap;margin:3px 0}
.chess{display:grid;grid-template-columns:repeat(8,21px);grid-auto-rows:21px;border:2px solid var(--fg);flex:none}
#panel .sq{border:0;padding:0;font-size:17px;line-height:21px;background:var(--bg);color:var(--fg);font-weight:400;font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols2","DejaVu Sans",sans-serif}
#panel .sq.dk{background:var(--o);color:var(--k)}
#panel .sq.on{outline:3px solid var(--fg);outline-offset:-3px}
#pwr{width:92px;height:92px;border-radius:50%;border:4px solid var(--o);background:none;display:flex;align-items:center;justify-content:center;animation:blink 2.4s ease-in-out infinite alternate}
#pwr span{display:block;width:36px;height:36px;border:4px solid var(--o);border-top-color:transparent;border-radius:50%;position:relative}
#pwr span::after{content:"";position:absolute;left:50%;top:-14px;width:4px;height:22px;margin-left:-2px;background:var(--o)}
.hexes{position:relative;height:143px;flex:none}
#panel .hx{position:absolute;width:22%;height:44px;border:0;padding:0;background:var(--fg);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
#panel .hx span{position:absolute;inset:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:9px}
#panel .hx.on span{background:var(--o);color:var(--k)}
#panel .hx.dn span{background:var(--fg);color:var(--bg)}
#panel .cslot{flex:1;min-height:36px;font-size:9px;padding:2px;word-break:break-word}
.legend{text-align:center;font-size:9px;letter-spacing:1px;margin-top:10px}
@keyframes flick{0%,91%,100%{opacity:1}92%{opacity:.84}93%{opacity:1}96%{opacity:.93}97%{opacity:1}}

/* intro splash */
#splash{position:fixed;inset:0;z-index:15;background:#000;color:var(--w);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;padding:34px;font-size:17px;line-height:1.7;letter-spacing:1.5px;text-align:center}
#splash p{margin:0;max-width:340px;min-height:1.7em}
#splash .tap{font-size:11px;color:var(--w);animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#pwr{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* gift-giver setup (not part of the game) */
#setup{position:fixed;inset:0;z-index:20;background:var(--k);color:var(--w);overflow:auto;padding:16px}
#setup .in{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
#setup input,#setup textarea{width:100%;font:inherit;font-size:16px;background:var(--w);color:var(--k);border:2px solid var(--o);padding:8px;-webkit-user-select:text;user-select:text}
#setup textarea{min-height:64px}
#setup button{background:var(--o);color:var(--k);border:0;padding:10px;font-size:14px}
#setup button.g{background:var(--k);color:var(--w);border:2px solid var(--w)}

/* pixel-art shell: stepped corners, chunky buttons */
:root{--px:polygon(0 12px,4px 12px,4px 8px,8px 8px,8px 4px,12px 4px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 4px,calc(100% - 8px) 4px,calc(100% - 8px) 8px,calc(100% - 4px) 8px,calc(100% - 4px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 4px) calc(100% - 12px),calc(100% - 4px) calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) calc(100% - 4px),calc(100% - 12px) calc(100% - 4px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 4px),8px calc(100% - 4px),8px calc(100% - 8px),4px calc(100% - 8px),4px calc(100% - 12px),0 calc(100% - 12px));
--px2:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
#device{position:relative;border:0;border-radius:0;box-shadow:none;background:var(--o);clip-path:var(--px);padding:20px 22px 24px}
#device::before,#device::after{content:"";position:absolute;clip-path:var(--px);z-index:0}
#device::before{inset:4px;background:var(--k)}
#device::after{inset:8px;background:var(--w)}
#device>*{position:relative;z-index:1}
#bezel{border-radius:0;clip-path:var(--px2);padding:12px}
#brand{background:linear-gradient(90deg,var(--k) 50%,transparent 50%) 0 100%/8px 4px repeat-x;padding-bottom:12px;margin-bottom:8px}
.hb{border-radius:0;border:0;box-shadow:none;clip-path:var(--px2);width:60px;height:56px;border-bottom:8px solid var(--o)}
.hb:active{transform:translateY(4px);box-shadow:none;border-bottom-width:4px;height:52px}
.tl,.tr{width:16px;height:20px;border:0;margin:0;background:var(--w);clip-path:polygon(0 40%,25% 40%,25% 30%,50% 30%,50% 15%,75% 15%,75% 0,100% 0,100% 100%,75% 100%,75% 85%,50% 85%,50% 70%,25% 70%,25% 60%,0 60%)}
.tr{transform:scaleX(-1)}
#bmenu,#bwords{border-radius:0;clip-path:var(--px2);padding:8px 14px;box-shadow:none}
#bwords{border-bottom:4px solid var(--k)}
.legend{background:linear-gradient(90deg,var(--k) 50%,transparent 50%) 50% 0/8px 4px repeat-x;padding-top:12px}
.bulb{display:inline-block;width:26px;height:26px;background:var(--k);border:2px solid var(--fg)}
.bulb.on{background:var(--o)}
#bub{position:absolute;z-index:1;max-width:64%;background:var(--bg);color:var(--fg);border:2px solid var(--fg);padding:3px 5px;font-size:10px;line-height:1.2;text-transform:uppercase;pointer-events:none}
#bub::after{content:"";position:absolute;right:16px;bottom:-8px;width:6px;height:6px;background:var(--bg);border:2px solid var(--fg);border-top:0}
#msg{position:relative}
#pface{position:absolute;right:2px;bottom:0;width:60px;height:52px;image-rendering:pixelated;image-rendering:crisp-edges}
#msg.talk{padding:2px 68px 2px 4px}
#msg.talk #msgt{display:block;position:relative;height:100%;border:2px solid var(--fg);padding:2px 5px;font-size:11px;line-height:1.2}
#msg.talk #msgt::after{content:"";position:absolute;right:-8px;bottom:10px;width:6px;height:6px;background:var(--bg);border:2px solid var(--fg);border-left:0}
.fog{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;border:2px solid var(--fg);background-color:var(--k);
  background-image:linear-gradient(45deg,var(--w) 25%,transparent 25%,transparent 75%,var(--w) 75%),linear-gradient(45deg,var(--w) 25%,transparent 25%,transparent 75%,var(--w) 75%);background-size:4px 4px;background-position:0 0,2px 2px;
  font-family:"Comic Sans MS","Chalkboard SE","Marker Felt","Bradley Hand",cursive;font-size:24px;font-weight:700;color:var(--k);text-transform:none;overflow:hidden}
.fog div{position:relative;white-space:nowrap;background:var(--k);padding:0 8px;border-radius:12px;text-shadow:1px 0 var(--k),-1px 0 var(--k),0 1px var(--k),0 -1px var(--k);color:var(--w)}
.fog .drip{position:absolute;top:92%;width:4px;background:var(--k);border-radius:0 0 2px 2px}
.gb{display:inline-flex;gap:2px;width:48px;justify-content:center;align-items:center}
.gb i{width:11px;height:11px;border:1px solid var(--fg);font-style:normal;text-align:center}
.gb i.m{width:14px;height:14px;border-width:3px}
.gb.ex{width:auto}
.gb.ex i{width:17px;height:17px;font-size:11px;line-height:15px}
.gb.ex i.m{width:20px;height:20px;line-height:14px}
.fog .sym{font-family:"Courier New",ui-monospace,monospace;font-size:30px;line-height:1;vertical-align:-2px}
.scr{position:relative;display:inline-block;text-decoration:line-through;text-decoration-thickness:3px}
.scr::after{content:"";position:absolute;inset:-4px -8px;background:repeating-linear-gradient(168deg,var(--fg) 0 2px,transparent 2px 6px),repeating-linear-gradient(14deg,var(--fg) 0 2px,transparent 2px 8px)}
.fly{position:fixed;left:0;top:0;z-index:30;width:34px;height:34px;background:var(--o);color:var(--k);border:3px solid var(--k);outline:2px solid var(--w);font-size:22px;line-height:28px;text-align:center;visibility:hidden;pointer-events:none;will-change:transform}
#bwords.blinkw{animation:wblink .5s steps(2) infinite}
@keyframes wblink{50%{background:var(--w)}}
.nl{display:inline-block;background:var(--o);color:var(--k);padding:0 2px;animation:nlin 1.3s .5s both}
@keyframes nlin{0%{opacity:0;transform:scale(2.4)}55%{opacity:1}100%{opacity:1;transform:scale(1)}}
#scr{position:fixed;inset:0;width:100vw;height:100vh;z-index:40;background:#000;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges}
.hexes{position:relative;width:216px;height:178px;margin:4px auto 0;flex:none}
#panel .hx{width:48px;height:55px}
#panel .hx span{font-size:9px}
#panel .hx b{background:var(--bg);color:var(--fg);padding:0 1px;font-weight:700}
#panel .hx.on span{inset:6px;background:var(--bg);color:var(--fg)}
#panel .hx.dn0 span{background:var(--o)}
#panel .hx.dn1 span{background:var(--fg)}
#panel .hx.dn2 span{background:repeating-linear-gradient(45deg,var(--o) 0 4px,var(--bg) 4px 8px)}
#panel .hx.dn3 span{background-color:var(--bg);background-image:linear-gradient(45deg,var(--fg) 25%,transparent 25%,transparent 75%,var(--fg) 75%),linear-gradient(45deg,var(--fg) 25%,transparent 25%,transparent 75%,var(--fg) 75%);background-size:6px 6px;background-position:0 0,3px 3px}
#panel .hxx{position:absolute;right:4px;top:4px;padding:2px 8px;z-index:1}
.vhs{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;overflow:hidden;border:2px solid var(--fg)}
.vhs pre{text-shadow:2px 0 var(--o);animation:vj 2.6s steps(1) infinite;font-size:12px;padding:14px 0}
.vhs i{position:absolute;font-style:normal;font-size:10px;color:var(--o);letter-spacing:1px}
.vhs .vt{left:6px;top:4px}
.vhs .vb{right:6px;bottom:4px}
.vhs::before{content:"";position:absolute;left:0;right:0;height:18px;top:-18px;background:repeating-linear-gradient(var(--fg) 0 2px,transparent 2px 5px);animation:vbar 3.2s linear infinite}
.vhs::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:repeating-linear-gradient(90deg,var(--fg) 0 3px,transparent 3px 5px,var(--o) 5px 9px,transparent 9px 14px)}
@keyframes vj{0%,84%{transform:none}86%{transform:translateX(4px) skewX(-8deg)}90%{transform:translateX(-3px) skewX(3deg)}94%{transform:none}}
@keyframes vbar{to{top:100%}}
.glx{animation:glx .09s steps(2) infinite}
@keyframes glx{0%{transform:translate(-5px,1px) skewX(9deg);filter:invert(1)}50%{transform:translate(6px,-2px) skewX(-11deg)}}
#controls{align-items:flex-end}
.mid{flex-direction:row;gap:8px;align-items:flex-end}
#bmenu,#bwords{padding:8px 10px}
.lt{display:inline-block;width:1.15em;text-align:center}
.lt.nl{padding:0}
#panel .jb{padding:3px 7px}
/* TV: readable text, soft translucent scan lines */
.vhs pre{text-shadow:none;font-size:13px;line-height:1.4;animation:vj 6s steps(1) infinite}
.vhs::before{height:34px;top:-34px;background:linear-gradient(transparent,rgba(244,236,216,.13),transparent);animation:vbar 5.5s linear infinite}
.vhs::after{inset:0;height:auto;background:repeating-linear-gradient(rgba(128,128,128,0) 0 2px,rgba(128,128,128,.13) 2px 3px);pointer-events:none}
@keyframes vj{0%,93%{transform:none}94%{transform:translateX(3px)}96%{transform:translateX(-2px)}98%{transform:none}}
.vhs .vb{top:4px;bottom:auto}
.vhs pre{padding-top:16px}
.vhs .warn{align-self:center;font-size:26px;letter-spacing:5px;padding:2px 14px;background:var(--o);color:var(--k);animation:wflash .5s steps(2) infinite}
@keyframes wflash{50%{background:var(--k);color:var(--o)}}
#dragw{position:relative;margin:2px auto;flex:none;touch-action:none}
.dt{position:absolute;left:0;top:4px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);text-align:center;font-size:16px;transition:transform .2s cubic-bezier(.3,1.5,.5,1);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.dt.ok{background:var(--o);color:var(--k)}
.dt.drag{transition:none;z-index:2;box-shadow:0 5px 0 var(--fg)}
#msg.rant{overflow:visible;z-index:6}
#msg.rant #msgt{overflow:visible}
.rt{position:absolute;left:-5px;top:0;width:124%;font-size:13px;line-height:1.02;letter-spacing:1px;transform:rotate(-2.5deg);pointer-events:none;text-shadow:1px 1px 0 var(--o);animation:rtj .11s steps(2) infinite}
@keyframes rtj{50%{transform:rotate(-2.5deg) translate(1px,-1px)}}
</style>
</head>
<body>
<div id="wrap">
  <div id="codes" hidden></div>
  <div id="device">
    <div id="brand">POOK<span>POCKET COMPANION</span></div>
    <div id="bezel"><div id="screen">
      <div id="status"><span id="rname"></span><span id="needs"></span></div>
      <div id="stage"><canvas id="cv" width="160" height="108"></canvas><div id="panel" hidden></div><div id="bub" hidden></div></div>
      <div id="msg"><span id="msgt"></span><canvas id="pface" width="30" height="26" hidden></canvas></div>
      <div id="inv"></div>
      <div id="fx"></div>
    </div></div>
    <div id="controls">
      <button class="hb" id="bl" aria-label="Previous room"><span class="tl"></span></button>
      <div class="mid"><button id="bwords">WORD</button><button id="bmenu">MENU</button></div>
      <button class="hb" id="br" aria-label="Next room"><span class="tr"></span></button>
    </div>
    <div class="legend">&lt; &gt; CHANGE ROOM &nbsp;·&nbsp; TAP THE SCREEN</div>
  </div>
</div>
<div id="splash" hidden></div>
<div id="setup" hidden></div>
<canvas id="scr" width="160" height="108" hidden></canvas>

<script>
'use strict';
/* ====================================================================
   GIFT SETTINGS — the only part you need to edit.
   key:     the first game's name (revealed letter by letter on tape one).
   key2:    the second game's name (tape two; leave blank for one game).
   name:    who it is for (optional).
   message: shown with the final key (optional).
   Or leave blank and open the page with #setup on the end of the
   address to make a personal link from your phone.
   Press F1 (or add #debug to the address) for skip options in the MENU.
   ==================================================================== */
const BAKED = { key: 'ENDACOPIA', key2: 'WEBFISHING', name: '', message: '' };
/* ==================================================================== */

const DEMO_KEYS = ['DEMO-KEY1-GOES-HERE', 'DEMO-KEY2-ALSO-HERE'];
const $ = s => document.querySelector(s);
const rand = n => Math.floor(Math.random() * n);

  $('#bub').hidden = true;
  const r = elCv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 160, y = (e.clientY - r.top) / r.height * 108;
  if (F.end) return say('POOK IS ASLEEP. HAPPY BIRTHDAY.');
  const it = sel; sel = null;
  const ps = pookSpot[S.room];
  const spots = [...(asleep() ? (S.room === 3 ? [H(38, 24, 28, 42, () => say('POOK IS ASLEEP.'))] : []) : [H(ps[0] - 14, ps[1] - 40, 28, 42, onPook)]), ...ROOMS[S.room].hot()];
  const h = spots.find(s => x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h);
  if (h) { sfx.look(); h.a(it); } else say(it ? 'NOTHING HAPPENS.' : 'NOTHING THERE.');
  save(); if (elPanel.hidden) render(); else renderInv();
});
$('#inv').addEventListener('click', e => {
  const b = e.target.closest('.sl'); if (!b || !b.dataset.i) return; const id = b.dataset.i;
  if (!elPanel.hidden) { if (panelInv && !panelModal) panelInv(id); return; }
  if (!sel) { sel = id; sfx.tap(); say(`${NAME(id)}.`); }
  else if (sel === id) { sel = null; say(''); }
  else {
    const a = sel, pair = [a, id].sort().join('+'); sel = null;
    if (pair === 'can+opener') { drop('can', 'opener'); give('canopen'); sfx.take(); say('THE CAN IS OPEN, IT SMELLS BAD.'); }
    else if (CAPS[a] && CAPS[id]) pourJug(a, id);
    else say('THOSE DO NOT GO TOGETHER.');
    save();
  }
  renderInv();
});
function go(d) { if (panelModal) return; closePanel(); $('#bub').hidden = true; sel = null; S.room = (S.room + d + 4) % 4; sfx.tap(); say(''); save(); render(); }
$('#bl').addEventListener('click', () => go(-1));
$('#br').addEventListener('click', () => go(1));
let forceDebug = false;
document.addEventListener('keydown', e => { if (e.key === 'F1') { e.preventDefault(); forceDebug = true; if (!panelModal) menu(); } });
$('#codes').addEventListener('click', e => { const b = e.target.closest('.crow'); if (!b || !elPanel.hidden) return; const k = +b.dataset.k; if (S.done.slice(k * 4, k * 4 + 4).every(Boolean)) keyReveal(k, null); });
let panelKind = null;
$('#bmenu').addEventListener('click', () => { if (panelModal) return; sfx.tap(); if (panelKind === 'menu') return closePanel(); menu(); panelKind = 'menu'; });
$('#bwords').addEventListener('click', () => {
  if (panelModal || Date.now() < scareT) return; sfx.tap();
  if (panelKind === 'words') return closePanel();
  if (F.pendEnd === 0 && !F.sc0) { F.sc0 = 1; save(); return scare(() => { wordsPanel(); panelKind = 'words'; }); }   // first jumpscare: pressing WORD after Pook sleeps
  wordsPanel(); panelKind = 'words';
});
function menu() {
  const dbg = isDebug(), st = stage();
  openPanel(`<div class="t">MENU</div><div class="row"><button data-a="snd">SOUND: ${muted ? 'OFF' : 'ON'}</button><button data-a="x">CLOSE</button></div>
    ${dbg ? `<div class="t">DEBUG — NEXT PUZZLE: ${st < 0 ? 'NONE' : (st + 1) + ' OF ' + 4 * nKeys()}</div>
    <div class="row"><button class="o" data-a="skip">SOLVE NEXT PUZZLE</button><button data-a="tape">JUMP TO TAPE 2</button><button data-a="ans">SHOW ANSWERS</button><button data-a="scare">TEST JUMPSCARE</button><button data-a="talk">TEST POOK LINE</button><button data-a="reset">RESET EVERYTHING</button></div>` : ''}`,
    a => {
      if (a === 'x') return closePanel();
      if (a === 'snd') { muted = !muted; store.set('pook-mute', muted); water(); sfx.tap(); return menu(); }
      if (a === 'skip') { dbgSolve(); return menu(); }
      if (a === 'scare') { closePanel(); return scare(); }
      if (a === 'talk') { closePanel(); return pookTalk(); }
      if (a === 'tape') { while (stage() >= 0 && stage() < 4) dbgSolve(); return menu(); }
      if (a === 'reset') { S = fresh(); F = S.f; sel = null; save(); closePanel(); nextTalk = Date.now() + 45000; return boot(); }
      if (a === 'ans') return note('ANSWERS', `1 CUPBOARD ${CUP_CODE}. COIN (SOFA) OPENS DRAWER. OPENER + CAN. CAN ON BOWL.
2 BEDROOM STARTS DARK: SWITCHES ${SW_ANS} LIGHT IT. POSTER GIVES TOY BOX ${[...MAZE_ANS].map(c => ARROW[c]).join('')}. BALL ON POOK.
3 DEN CHESS BOARD: QUEEN C4 TO G8 (A SACRIFICE), POOK TAKES WITH THE ROOK, THEN KNIGHT H6 TO F7 IS MATE (GIVES PLUG). HOT TAP, MIRROR, CABINET ${CAB_CODE} (GIVES SOAP). PLUG + SOAP ON TUB.
4 NIGHTSTAND NOTE = MIDDLE LETTERS OF 3-LETTER WORDS. WARDROBE TILES: HAT EGG DOG ANT EYE (AGONY). BLANKET ON BED, THEN SWITCHES ${SW_ANS} AGAIN FOR DARK, THEN TAP THE BED.
5 THREE JUGS 10/7/3, BIG ONE FULL. POUR 10>7, 7>3, 3>10, 7>3, 3>10, 7>3, 10>7, 7>3. THE 7-JUG NOW HOLDS 5: USE IT ON THE BOWL. (BIG JUG ON TAP = START OVER. NOTHING CAN BE DUMPED.)
6 CABINET: PILL FROM "MIXED". WHITE = GIVE THAT JAR. ORANGE = GIVE "NOT MEDICINE".
7 TV HEX GROUPS: BONE CANINE KITTEN WEIGHT / TIRED STEAL SULTAN SUBLIME / DOGMA PLANT BEEF SCOWL / FARMER HEART CHIPS CLIPS. THEN READ THE 5 CHANNELS. RIGHT NOW THE BEAR IS ${F.liar ? PLACES[F.liar.ans] : 'NOT PLACED UNTIL THE TV TUNES'} (MOVES AFTER A WRONG SEARCH). BEAR ON POOK.
8 CARDS: DRAWER, TOY BOX, TOWEL, BED. MUSIC BOX ORDER, LEFT TO RIGHT: POOK, MAILMAN, VACUUM, DARK.`);
    });
}
function dbgSolve() {
  const i = stage(); if (i < 0) return;
  S.done[i] = 1; FIX[i](); S.hi = 0;
  if (i === 3 && nKeys() > 1) startNight();
  if (i === 4 * nKeys() - 1) { F.end = 1; S.room = 3; }
  save(); render();
}

/* ---------- gift-giver setup ---------- */
function setup() {
  const c = store.get('pook-cfg') || BAKED, el = $('#setup');
  el.innerHTML = `<div class="in"><div style="font-size:18px;color:var(--o)">GIFT SETUP</div><div>Only for the gift-giver. Fill this in, make the link, and send that link on the day.</div>
    <label>Game 1 name (tape one)<input id="skey" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX" value="${esc(c.key || '')}"></label>
    <label>Game 2 name (tape two — blank for one game)<input id="skey2" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX" value="${esc(c.key2 || '')}"></label>
    <label>Their name (optional)<input id="sname" autocomplete="off" value="${esc(c.name || '')}"></label>
    <label>Message shown at the very end (optional)<textarea id="smsg">${esc(c.message || '')}</textarea></label>
    <button id="smake">MAKE LINK</button>
    <div id="sout" hidden><label>Personal link<textarea id="slink" readonly></textarea></label><button id="scopy">COPY LINK</button> <button id="sopen" class="g">TRY IT</button></div>
    <button id="sreset" class="g">RESET PROGRESS ON THIS PHONE</button><button id="sclose" class="g">CLOSE</button></div>`;
  el.hidden = false;
  $('#smake').onclick = () => {
    const o = { key: $('#skey').value.trim(), key2: $('#skey2').value.trim(), name: $('#sname').value.trim(), message: $('#smsg').value.trim() };
    if (!o.key) { $('#skey').focus(); return; }
    $('#slink').value = location.href.split('#')[0] + '#g=' + encCfg(o); $('#sout').hidden = false;
  };
  $('#scopy').onclick = () => copyText($('#slink').value, $('#scopy'));
  $('#sopen').onclick = () => { location.href = $('#slink').value; location.reload(); };
  $('#sreset').onclick = () => { store.del('pook-v2'); S = fresh(); F = S.f; sel = null; $('#sreset').textContent = 'PROGRESS RESET'; };
  $('#sclose').onclick = () => { el.hidden = true; history.replaceState(null, '', location.href.split('#')[0]); boot(); };
}

/* ---------- intro splash: black screen, text types itself ---------- */
function splash(done) {
  const el = $('#splash'), lines = ['FOR YOUR BIRTHDAY, YOU WERE GIFTED AN OLD TOY YOU SCARCELY REMEMBER FROM CHILDHOOD.', 'BUT SOMETHING FEELS DIFFERENT.'];
  el.innerHTML = '<p id="sp0"></p><p id="sp1" style="color:var(--o)"></p><p id="sp2" class="tap" style="visibility:hidden">TAP TO BEGIN</p>'; el.hidden = false;
  let li = 0, ci = 0, fin = false, timer = 0;
  const finish = () => { fin = true; clearTimeout(timer); lines.forEach((t, i) => { $('#sp' + i).textContent = t; }); $('#sp2').style.visibility = 'visible'; };
  const step = () => {
    if (li >= lines.length) return finish();
    $('#sp' + li).textContent = lines[li].slice(0, ++ci); if (ci % 2) beep(170, .02, 'square', .02);
    if (ci >= lines[li].length) { li++; ci = 0; timer = setTimeout(step, 1800); } else timer = setTimeout(step, 75);
  };
  timer = setTimeout(step, 1000);
  el.onclick = () => { if (!fin) return; el.hidden = true; el.onclick = null; clearTimeout(timer); sfx.tap(); done(); };
}

function power(next) {
  const el = $('#splash'); el.onclick = null;
  el.innerHTML = '<button id="pwr" aria-label="Power"><span></span></button><p class="tap" style="animation:none">POWER</p>'; el.hidden = false;
  $('#pwr').onclick = e => { e.stopPropagation(); beep(880, .07); beep(1320, .12, 'square', .04, .08); next(); };
}

/* ---------- boot ---------- */
function boot() {
  loadCfg(); F = S.f; $('#setup').hidden = true;
  if (/(^|#|&)setup\b/.test(location.hash)) return setup();
  closePanel(); render(); say('');
  power(() => splash(() => { if (S.boot) return; pages(['POOK-OS 1.3\n(C) 1987 SHAKECO HOME ELECTRONICS\n\nCARETAKER UNIT ONLINE.', `LOADING COMPANION: POOK\n<span id="ld" style="display:inline-block;width:19ch;text-align:left"></span><span id="ld2" style="visibility:hidden">\n\nHAPPY BIRTHDAY${CFG.name ? ', ' + esc(CFG.name) : ''}.</span>`,
    'POOK HAS NEEDS.\nMEET THEM, AND POOK WILL GIVE BACK\nWHAT HE IS KEEPING FOR YOU.', '<span id="gl">DO NOT LEAVE POOK ALONE\nFOR TOO LONG.</span>'],
    () => { S.boot = true; save(); say('POOK IS HUNGRY.'); }); }));
}
window.addEventListener('hashchange', boot);
boot();
</script>
